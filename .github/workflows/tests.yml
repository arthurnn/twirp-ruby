name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ruby-test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby_version }} with ${{ matrix.gemfile }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile

    strategy:
      matrix:
        ruby_version:
          - "3.0"
          - "3.1"
          - "head"
        gemfile:
          - "faraday-0"
          - "faraday-1"
          - "faraday-2"
          - "rack-2"
          - "rack-3"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true

      - name: Run Tests
        run: bundle exec rake test
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run Go tests
        run: go test ./protoc-gen-twirp_ruby/... ./internal/gen/typemap/...
