name: Go Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Go version to release (e.g., 1.13.0)'
        required: true
      confirm:
        description: 'Type "yes" to confirm release'
        required: true

jobs:
  run-tests:
    if: ${{ github.event.inputs.confirm == 'yes' }}
    name: Run Tests
    uses: ./.github/workflows/tests.yml

  release:
    if: ${{ github.event.inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Tag and push
        run: |
          # Create and push both tags
          git tag go-v${{ github.event.inputs.version }}
          git push origin go-v${{ github.event.inputs.version }}

          # Also create standard Go module version tag
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: go-v${{ github.event.inputs.version }}
          name: Go v${{ github.event.inputs.version }}
          body: |
            Go Release v${{ github.event.inputs.version }}

            See RELEASE_NOTES.md for details.
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
